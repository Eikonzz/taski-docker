volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    container_name: backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8000))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    env_file: .env
    build: ./frontend/
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./gateway/
    ports:
      - 8000:80
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static:/staticfiles
